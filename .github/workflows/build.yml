name: Crea app pronte (Windows e Mac)

# Si avvia a mano (Actions → Crea app pronte → Run workflow) oppure quando crei una release con un tag (es. v1.0).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-14   # Mac con chip Apple (M1, M2, M3…)
            name: Mac-Apple-Silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - name: Windows .exe
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "Diario del Ricercatore" diario_web.py
          Compress-Archive -Path "dist/Diario del Ricercatore.exe" -DestinationPath "Diario-Windows.zip"
      - name: Mac .app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "Diario del Ricercatore" diario_web.py
          ditto -c -k --keepParent "dist/Diario del Ricercatore.app" "Diario-Mac-Apple-Silicon.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Diario-${{ matrix.name }}
          path: Diario-*.zip
      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Diario-*.zip
