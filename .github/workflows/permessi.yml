name: Sistema i permessi (Mac)

# I file caricati dal sito di GitHub perdono il permesso di esecuzione: questo lo rimette da solo,
# cosi' chi scarica il Diario su Mac non deve fare "chmod".
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  chmod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git update-index --chmod=+x "Avvia Diario.command"
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Permesso di esecuzione per Avvia Diario.command"
            git push
          fi
